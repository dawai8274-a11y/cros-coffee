<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDA15E" />
      <stop offset="100%" stop-color="#BC6C25" />
    </linearGradient>
    <linearGradient id="techGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0A96D" />
      <stop offset="100%" stop-color="#7F4F24" />
    </linearGradient>
  </defs>
  <!-- Emblem: Futuristic geometric cross & coffee bean fusion -->
  <g transform="translate(5, 5)">
    <!-- Outer fine orbital ring -->
    <circle cx="25" cy="25" r="23" fill="none" stroke="url(#grad1)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
    <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    
    <!-- Precision Cross Marks (Futuristic telemetry ticks) -->
    <line x1="25" y1="1" x2="25" y2="6" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="44" x2="25" y2="49" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
    <line x1="1" y1="25" x2="6" y2="25" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
    <line x1="44" y1="25" x2="49" y2="25" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>

    <!-- Stylized Coffee Bean / Futuristic Cross Monogram -->
    <!-- Two interlocking aerodynamic curved petals forming an X/Cross and Bean silhouette -->
    <path d="M16 14 C 20 18, 30 18, 34 14 C 34 22, 28 32, 16 36 C 16 28, 20 20, 16 14 Z" fill="url(#techGlow)" opacity="0.9"/>
    <path d="M34 36 C 30 32, 20 32, 16 36 C 16 28, 22 18, 34 14 C 34 22, 30 30, 34 36 Z" fill="url(#grad1)" opacity="0.75"/>
    <circle cx="25" cy="25" r="3.5" fill="#FFF" />
    <circle cx="25" cy="25" r="2" fill="#BC6C25" />
  </g>

  <!-- Wordmark: cros -->
  <text x="65" y="37" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="4" fill="currentColor">
    cros
  </text>
  <text x="67" y="49" font-family="'Space Grotesk', 'Courier New', monospace" font-size="7.5" font-weight="600" letter-spacing="4.5" fill="#BC6C25" opacity="0.9">
    COFFEE LAB
  </text>
</svg>